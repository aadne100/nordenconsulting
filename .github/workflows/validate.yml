name: Validate Norden website
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, redesign/norden-portfolio]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check internal links, structured data and media
        run: python3 tools/check-site.py
      - name: Verify JavaScript syntax
        run: node --check js/site.js
